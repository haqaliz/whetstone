[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution is `whetstonehq` because `whetstone` is already taken on PyPI
# (verified 2026-07-26). The import package and the CLI stay `whetstone` — the same
# split the sibling project uses for its own distribution. Do not "fix" this mismatch:
# `__version__` resolves the DISTRIBUTION name, so changing one without the other breaks it
# loudly.
name = "whetstonehq"
version = "0.14.1"
description = "A model that trains itself overnight — and proves it didn't cheat."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Zero runtime dependencies: the CLI is stdlib-only, and nothing on the future
# reward path may pull in an inference library. ML deps live in the optional
# groups below so P1's import guard is not pre-poisoned.
dependencies = []

[project.scripts]
whetstone = "whetstone.cli:main"

[project.optional-dependencies]
# Optional, never a dev dependency: the test suite must not depend on mlx. CI installs
# this group on macOS solely to prove it resolves AND imports — `mlx-lm` declares
# `mlx; platform_system == "Darwin"`, so off Darwin it installs with no engine behind it.
mlx = ["mlx-lm>=0.31,<0.32"]

# The portability arm's runtime (`PREREGISTRATION.md` § 10.11). Optional for the same reason
# `mlx` is: the reward path must not acquire an inference stack, and the suite must not depend
# on one. Bounded at both ends for the reason the mlx pin is — an unbounded floor means "the
# pinned version" is whatever the index served that morning, which is how night #1 was lost.
# On a CPU-only Linux host the default `torch` wheel drags in the whole bundled CUDA stack —
# measured here at roughly 8 GB of `nvidia-*` packages on a machine with no GPU, which is both
# a long install and a poor first impression for anyone whose Linux box is a laptop. Point uv at
# the CPU index to skip all of it:
#
#     uv sync --extra torch --index-url https://download.pytorch.org/whl/cpu
#
# The dependency is deliberately NOT pinned to the CPU build here: a CUDA host wants the CUDA
# wheel, and encoding one host's answer in the manifest would make the other reinstall to undo
# it. The index is the caller's choice because the hardware is.
torch = [
  "torch>=2.4,<3",
  "transformers>=4.44,<6",
  "peft>=0.13,<1",
  "datasets>=3,<5",
  "accelerate>=1,<2",
]

[dependency-groups]
# `pyyaml` is a DEV dependency, never a runtime one: the model card's frontmatter guard
# parses the block the way the Hub parses it, and a regex over the text would assert this
# repository's idea of YAML instead. In the dev group it is present under a plain
# `uv sync` — so the guard actually runs in CI rather than skipping there, which is a
# green suite in which nothing was checked. Runtime dependencies stay at zero.
dev = ["pytest>=8", "ruff", "mypy", "pyyaml"]

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# RUF is selected in part for RUF100: an unused `# noqa` is itself an error, so a
# suppression added to make a check pass cannot quietly outlive the problem.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
strict = true
# An unnecessary `# type: ignore` is an error. Every escape hatch stays visible and
# has to keep earning its place.
warn_unused_ignores = true

# `mlx-lm` ships no type stubs, and it is an OPTIONAL extra: CI type-checks under a
# plain `uv sync` (`ci.yml:29-31`), where `import mlx_lm` cannot be resolved at all.
# Without this, `mypy src/` fails on the one module allowed to import it —
# `whetstone/bakeoff/mlx_runtime.py`. A per-line `# type: ignore` is the wrong tool
# here twice over: it would be UNUSED on a machine that has run `uv sync --extra mlx`,
# and `warn_unused_ignores` above turns that into an error, so the check would pass in
# exactly one of the two environments this project supports.
# `huggingface_hub` is here for the same reason and was missed the first time, in the
# direction that is easy to miss: it arrives *with* the mlx extra, so a developer who has
# run `uv sync --extra mlx` sees a clean `mypy src/` while CI — which type-checks under a
# plain `uv sync` — cannot resolve it at all. The local check being the more permissive
# one is what let `bakeoff/weights.py` reach a pull request red. Both directions now have
# a step: `ci.yml` runs mypy under a plain sync AND again with the extra installed.
[[tool.mypy.overrides]]
# `torch.*` is here before a Torch backend exists: `loop/backend.py` names the runtime it
# would detect, so the import is type-checked on a machine that has neither runtime.
module = [
    "huggingface_hub.*",
    "mlx.*",
    "mlx_lm.*",
    "torch.*",
    "transformers.*",
    "peft.*",
    "datasets.*",
    "accelerate.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
