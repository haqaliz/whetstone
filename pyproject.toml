[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution is `whetstonehq` because `whetstone` is already taken on PyPI
# (verified 2026-07-26). The import package and the CLI stay `whetstone` — the same
# split the sibling project uses for its own distribution. Do not "fix" this mismatch:
# `__version__` resolves the DISTRIBUTION name, so changing one without the other breaks it
# loudly.
name = "whetstonehq"
version = "0.8.0"
description = "A model that trains itself overnight — and proves it didn't cheat."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Zero runtime dependencies: the CLI is stdlib-only, and nothing on the future
# reward path may pull in an inference library. ML deps live in the optional
# groups below so P1's import guard is not pre-poisoned.
dependencies = []

[project.scripts]
whetstone = "whetstone.cli:main"

[project.optional-dependencies]
# Optional, never a dev dependency: the test suite must not depend on mlx. CI installs
# this group on macOS solely to prove it resolves AND imports — `mlx-lm` declares
# `mlx; platform_system == "Darwin"`, so off Darwin it installs with no engine behind it.
mlx = ["mlx-lm>=0.31"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# RUF is selected in part for RUF100: an unused `# noqa` is itself an error, so a
# suppression added to make a check pass cannot quietly outlive the problem.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
strict = true
# An unnecessary `# type: ignore` is an error. Every escape hatch stays visible and
# has to keep earning its place.
warn_unused_ignores = true

# `mlx-lm` ships no type stubs, and it is an OPTIONAL extra: CI type-checks under a
# plain `uv sync` (`ci.yml:29-31`), where `import mlx_lm` cannot be resolved at all.
# Without this, `mypy src/` fails on the one module allowed to import it —
# `whetstone/bakeoff/mlx_runtime.py`. A per-line `# type: ignore` is the wrong tool
# here twice over: it would be UNUSED on a machine that has run `uv sync --extra mlx`,
# and `warn_unused_ignores` above turns that into an error, so the check would pass in
# exactly one of the two environments this project supports.
# `huggingface_hub` is here for the same reason and was missed the first time, in the
# direction that is easy to miss: it arrives *with* the mlx extra, so a developer who has
# run `uv sync --extra mlx` sees a clean `mypy src/` while CI — which type-checks under a
# plain `uv sync` — cannot resolve it at all. The local check being the more permissive
# one is what let `bakeoff/weights.py` reach a pull request red. Both directions now have
# a step: `ci.yml` runs mypy under a plain sync AND again with the extra installed.
[[tool.mypy.overrides]]
module = ["huggingface_hub.*", "mlx.*", "mlx_lm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
